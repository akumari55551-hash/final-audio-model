# Initial experimental defaults only; validate against the selected dataset,
# target hardware, and an independently held-out evaluation set.
project:
  name: voice-cloning-anti-spoofing
  seed: 42
  device: auto  # Resolve to CUDA only when torch.cuda.is_available() is true.

audio:
  sample_rate_hz: 16000
  channels: 1
  sample_format: float32
  fixed_window_seconds: 2.0
  window_hop_seconds: 0.5
  amplitude_policy: sanitize_and_clip  # NaN/Inf -> 0, clip to [-1, 1]; no peak normalization.
  resampler: scipy_resample_poly
  resampler_window: hann
  window_seconds: 2.0
  hop_seconds: 0.5
  max_stream_seconds: 300
  retain_raw_audio: false

features:
  name: lfcc
  n_fft: 512
  win_length: 400
  hop_length: 160
  n_filters: 64
  n_coefficients: 40
  f_min_hz: 0
  f_max_hz: 8000
  preemphasis: 0.97
  log_energy_floor: 1.0e-10
  spectrum: power
  window: hann_periodic
  center: false
  normalization: none  # No evaluation-split or globally fitted statistics.

model:
  architecture: small_cnn
  initialization: random
  pretrained_weights: false
  seed: 42
  dropout: 0.3
  input_shape: [batch, 1, n_lfcc, frames]
  classes:
    - bona_fide
    - spoof

training:
  # Use a combined official train/dev manifest or provide separate paths.
  # Evaluation rows are never loaded by training/train.py.
  manifest_path: data/manifests/asvspoof2019_la.csv
  train_manifest: data/manifests/asvspoof2019_la.csv
  dev_manifest: data/manifests/asvspoof2019_la.csv
  preprocessing_config: configs/baseline.yaml
  epochs: 30
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0  # Windows-friendly default; tune after validation.
  device: auto  # CUDA when available, otherwise CPU.
  mixed_precision: true  # Effective only when CUDA is available.
  deterministic: false  # Set true to request deterministic PyTorch algorithms.
  imbalance_strategy: weighted_loss  # none | weighted_loss | weighted_sampler
  validation_window_batch_size: 16
  early_stopping_patience: 6
  scheduler:
    factor: 0.5
    patience: 2
    min_lr: 0.000001
  checkpoint_dir: checkpoints
  manifest_dir: data/manifests
  split_strategy: speaker_disjoint

inference:
  score_aggregation: exponential_moving_average
  ema_alpha: 0.3
  minimum_windows: 3
  reject_invalid_audio: true
  discard_audio_after_scoring: true

risk:
  # Starting values only. Replace thresholds using development calibration;
  # risk/model scores are not calibrated real-world fraud probabilities.
  history_size: 12
  minimum_valid_predictions: 3
  minimum_usable_windows: 3
  alert_threshold: 0.8
  high_risk_threshold: 0.95
  low_risk_threshold: 0.5
  alert_persistence_windows: 2
  high_risk_persistence_windows: 3
  recovery_persistence_windows: 3
  cooldown_seconds: 15.0
  smoothing_method: median_then_ema
  ema_alpha: 0.35
  correlation_group_seconds: 2.0
  minimum_audio_quality: ok
  calibration_path: null
  threshold_source: uncalibrated_placeholder
  require_human_confirmation: true
  prohibit_automated_high_impact_actions: true
